name: Update upstreams

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

concurrency:
  group: update-upstreams
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      AUTOMATION_BRANCH: automation/update-upstreams
    steps:
      - name: Checkout develop
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0

      - name: Rebuild automation branch from develop
        shell: bash
        run: |
          git fetch origin '+refs/heads/develop:refs/remotes/origin/develop'
          set +e
          git ls-remote --exit-code --heads origin "refs/heads/$AUTOMATION_BRANCH" >/dev/null
          branch_status=$?
          set -e
          if [[ "$branch_status" -eq 0 ]]; then
            git fetch origin "+refs/heads/$AUTOMATION_BRANCH:refs/remotes/origin/$AUTOMATION_BRANCH"
          elif [[ "$branch_status" -ne 2 ]]; then
            echo 'Failed to inspect the existing automation branch.' >&2
            exit "$branch_status"
          fi
          git checkout -B "$AUTOMATION_BRANCH" origin/develop

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install updater dependencies
        run: pnpm install --frozen-lockfile

      - name: Update upstream locks
        run: pnpm upstreams:update

      - name: Check for upstream changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- upstream.lock.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No upstream changes detected.'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.changes.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify deployment build
        if: steps.changes.outputs.changed == 'true'
        run: pnpm deploy:build

      - name: Commit lock update
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add upstream.lock.json
          git commit -m 'chore(data): update upstream locks'

      - name: Push automation branch
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          remote_ref="refs/remotes/origin/$AUTOMATION_BRANCH"
          if git show-ref --verify --quiet "$remote_ref"; then
            expected="$(git rev-parse "$remote_ref")"
            git push --force-with-lease="refs/heads/$AUTOMATION_BRANCH:$expected" origin "HEAD:$AUTOMATION_BRANCH"
          else
            git push --force-with-lease="refs/heads/$AUTOMATION_BRANCH:" origin "HEAD:$AUTOMATION_BRANCH"
          fi

      - name: Prepare pull request details
        if: steps.changes.outputs.changed == 'true'
        id: pr-details
        shell: bash
        run: |
          old_lock="$(git show origin/develop:upstream.lock.json)"
          new_lock="$(cat upstream.lock.json)"
          {
            echo 'body<<EOF'
            echo 'Automated upstream lock update from the latest `develop`.'
            echo
            echo '| Upstream | Previous | Latest | Status |'
            echo '| --- | --- | --- | --- |'
            for key in turnBasedGameData starRailRes; do
              if [[ "$key" == 'turnBasedGameData' ]]; then label='TurnBasedGameData'; else label='StarRailRes'; fi
              old_sha="$(jq -r ".$key.commit" <<<"$old_lock")"
              new_sha="$(jq -r ".$key.commit" <<<"$new_lock")"
              if [[ "$old_sha" == "$new_sha" ]]; then status='unchanged'; else status='changed'; fi
              printf '| %s | `%s` | `%s` | %s |\n' "$label" "${old_sha:0:7}" "${new_sha:0:7}" "$status"
            done
            echo
            echo 'Checks passed:'
            echo '- `pnpm install --frozen-lockfile`'
            echo '- `pnpm deploy:build`'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create or update pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ steps.pr-details.outputs.body }}
        shell: bash
        run: |
          pr_number="$(gh pr list --base develop --head "$AUTOMATION_BRANCH" --state open --json number --jq '.[0].number')"
          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" --title 'chore(data): update upstream data' --body "$PR_BODY"
          else
            gh pr create --base develop --head "$AUTOMATION_BRANCH" --title 'chore(data): update upstream data' --body "$PR_BODY"
          fi
