name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validation:
    name: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && 'Correctness' || 'Development' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HSR_DATA_ROOT: .upstream/TurnBasedGameData
      HSR_ASSET_ROOT: .upstream/StarRailRes
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Development validation
        if: github.event_name == 'push' || github.base_ref == 'develop'
        run: pnpm ci:develop

      - name: Run full correctness validation
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: pnpm ci:validate

      - name: Install Chromium
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E smoke tests
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          PLAYWRIGHT_REUSE_BUILD: '1'
        run: pnpm test:e2e:smoke
